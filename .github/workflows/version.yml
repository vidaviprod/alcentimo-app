# Va en el repositorio vidaviprod/alcentimo-app, en .github/workflows/version.yml.
# Cada vez que se publica, edita o borra un release, regenera version.json en la rama main con la última
# versión (número, fecha, tamaño del APK y novedades) y las dos anteriores. La web lo lee desde
# raw.githubusercontent.com, que no tiene el límite de 60 consultas por hora de la API de GitHub.
name: Actualizar version.json

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-json

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generar version.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 10
            });
            const rels = data.filter(r => !r.draft && !r.prerelease).slice(0, 3);
            if (!rels.length) { core.info("No hay releases publicados."); return; }

            // "v1.6.0", "1.6.0" y "v.1.6.0" dan "1.6.0".
            const limpiar = t => String(t || "").trim().replace(/^v\.?\s*/i, "");
            // Las viñetas de la descripción, sin lo que vaya bajo un encabezado de "Cambios técnicos".
            const vinetas = md => {
              const out = []; let saltar = false;
              for (const l of String(md || "").split(/\r?\n/)) {
                const h = l.match(/^#{1,6}\s+(.*)/);
                if (h) { saltar = /t[eé]cnic/i.test(h[1]); continue; }
                const m = l.match(/^\s*[-*]\s+(.*)/);
                if (m && !saltar) out.push(m[1].trim());
              }
              return out;
            };
            const info = r => ({ version: limpiar(r.tag_name), fecha: (r.published_at || "").slice(0, 10), novedades: vinetas(r.body) });

            const ult = rels[0];
            const apk = ult.assets.find(a => a.name === "alcentimo.apk") || ult.assets.find(a => /\.apk$/i.test(a.name));
            const json = { ...info(ult), tamano: apk ? apk.size : null, anteriores: rels.slice(1).map(info) };
            fs.writeFileSync("version.json", JSON.stringify(json, null, 2) + "\n");
            core.info(`version.json -> ${json.version}`);

      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json no ha cambiado."
          else
            git commit -m "version.json: ${{ github.event.release.tag_name || 'manual' }}"
            git push
          fi
